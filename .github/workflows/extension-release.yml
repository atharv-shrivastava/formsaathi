name: FormSaathi Chrome Extension Release

on:
  push:
    branches:
      - feat/web-app-foundation
    paths:
      - "extension/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/extension-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.22.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build and package Chrome extension
        run: pnpm --filter @formsaathi/extension zip

      - name: Prepare stable release asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          archive="$(find extension/.output -type f -name '*.zip' -print -quit)"
          test -n "$archive"
          cp "$archive" release/FormSaathi-Chrome-Extension.zip

      - name: Publish development release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: extension-v0.1.0
          target_commitish: ${{ github.sha }}
          name: FormSaathi Chrome Extension v0.1.0
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: release/FormSaathi-Chrome-Extension.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: formsaathi-chrome-extension-release
          path: release/FormSaathi-Chrome-Extension.zip
          if-no-files-found: error
          retention-days: 30
