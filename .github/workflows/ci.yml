name: FormSaathi CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check local service syntax
        run: npm run check:server
      - name: Run extraction tests
        run: npm test
      - name: Build Chrome extension
        run: npm run build:extension
