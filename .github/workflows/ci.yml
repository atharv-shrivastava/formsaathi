name: FormSaathi CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.22.0

      - name: Install dependencies
        # Generate the lockfile during this initial migration. Once pnpm-lock.yaml
        # is committed, change this to: pnpm install --frozen-lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Check local service syntax
        run: pnpm check:server

      - name: Type-check web app
        run: pnpm check:web

      - name: Build web app
        run: pnpm build:web

      - name: Run extraction tests
        run: pnpm test

      - name: Build Chrome extension
        run: pnpm build:extension
