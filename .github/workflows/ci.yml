name: FormSaathi CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check RapidOCR service syntax
        run: python -m compileall -q rapidocr_service

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.22.0

      - name: Install dependencies
        # Generate the lockfile during this initial migration. Once pnpm-lock.yaml
        # is committed, change this to: pnpm install --frozen-lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Check local service syntax
        run: pnpm check:server

      - name: Type-check web app
        run: pnpm check:web

      - name: Build web app
        env:
          VITE_SUPABASE_URL: https://jsurlqzbpmianyvmteto.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_mhQpx1mfXkp1J6Nrpy2JdA_kx_GThap
          VITE_OCR_API_URL: https://formsaathi-ocr-api.onrender.com
        run: pnpm build:web

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: formsaathi-web-dist
          path: web/dist/
          if-no-files-found: error
          retention-days: 3

      - name: Run extraction tests
        run: pnpm test

      - name: Build Chrome extension
        run: pnpm build:extension

      - name: Package Chrome extension
        run: pnpm --filter @formsaathi/extension zip

      - name: Stage extension package
        run: |
          mkdir -p release
          cp extension/.output/*.zip release/FormSaathi-Chrome-Extension.zip

      - name: Upload extension package
        uses: actions/upload-artifact@v4
        with:
          name: formsaathi-chrome-extension
          path: release/FormSaathi-Chrome-Extension.zip
          if-no-files-found: error
          retention-days: 14
